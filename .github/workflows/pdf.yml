
name: Generate CV PDF

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches:
      - main
    paths:
      - '_data/cv.yml'
      - 'cv-pdf.tex'
      - '.github/workflows/pdf.yml'
  workflow_dispatch:

jobs:
  generate-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            fonts-dejavu-core

      - name: Generate PDF from YAML
        run: |
          pandoc /dev/null \
            --from=markdown \
            --metadata-file=_data/cv.yml \
            --template=cv-pdf.tex \
            --pdf-engine=xelatex \
            --output=cv.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ioanna-cv-pdf
          path: cv.pdf
          if-no-files-found: error

      - name: Install Jekyll
        run: |
          sudo gem install jekyll -v 4.4.1 --no-document

      - name: Build Jekyll website
        run: |
          jekyll build --destination _site

      - name: Include PDF in website
        run: |
          cp cv.pdf _site/cv.pdf

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-website-preview
          path: _site/
          if-no-files-found: error

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages deployment artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
